name: Windows agent

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-agent.yml"
      - "apps/windows-agent/**"
      - "global.json"
      - "protocol/v1/test-vectors/input-frames.json"
  pull_request:
    paths:
      - ".github/workflows/windows-agent.yml"
      - "apps/windows-agent/**"
      - "global.json"
      - "protocol/v1/test-vectors/input-frames.json"

permissions:
  contents: read

jobs:
  test:
    name: Build and test (.NET 10 / Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: >-
          dotnet restore
          apps/windows-agent/HarmonyPcTouchpad.WindowsAgent.slnx
          --locked-mode

      - name: Test Windows agent
        run: >-
          dotnet test
          apps/windows-agent/HarmonyPcTouchpad.WindowsAgent.slnx
          --configuration Release
          --no-restore

      - name: Publish console-free tray shell
        run: >-
          dotnet publish
          apps/windows-agent/src/HarmonyPcTouchpad.Agent.App/HarmonyPcTouchpad.Agent.App.csproj
          --configuration Release
          --self-contained false
          --no-restore
